<body>
  <div id="arcade-cabinet">
    <header class="game-header">
      <div class="title-group">
        <h1 class="main-title">寶島風情畫</h1>
        <span class="subtitle">STAGE 1: 台北空照 (LEVEL 1)</span>
      </div>
      <div class="header-actions">
        <button id="lvl-toggle-btn" class="arcade-btn">🗺️ 第一關：台北</button>
        <button id="sound-toggle-btn" class="arcade-btn">🔊 音效</button>
        <button id="crt-toggle-btn" class="arcade-btn">📺 CRT 濾鏡</button>
        <button id="fullscreen-btn" class="arcade-btn">⛶ 全螢幕</button>
        <button id="start-btn" class="arcade-btn primary-btn">▶ 開始遊戲</button>
      </div>
    </header>

    <main class="screen-wrapper">
      <canvas id="gameCanvas" width="800" height="480" aria-label="寶島風情畫遊戲畫面"></canvas>
      <div id="crt-scanlines" class="crt-overlay active"></div>
      <div id="rotate-prompt" class="rotate-prompt" role="status">
        <span class="rotate-icon">↻</span>
        <strong>請將手機轉為橫向</strong>
        <small>橫向後即可全螢幕遊玩</small>
      </div>

      <!-- On-Screen Virtual Controls for Mobile/Touch -->
      <div id="touch-controls" class="touch-controls">
        <div class="dpad" aria-label="移動控制">
          <button id="btn-up" class="dpad-btn up" aria-label="向上">▲</button>
          <div class="dpad-mid">
            <button id="btn-left" class="dpad-btn left" aria-label="向左">◀</button>
            <div class="dpad-center"></div>
            <button id="btn-right" class="dpad-btn right" aria-label="向右">▶</button>
          </div>
          <button id="btn-down" class="dpad-btn down" aria-label="向下">▼</button>
        </div>

        <div class="action-buttons" aria-label="動作控制">
          <button id="btn-bomb" class="act-btn bomb-btn" aria-label="使用炸彈">💣</button>
          <button id="btn-fire" class="act-btn fire-btn" aria-label="射擊">⚡</button>
        </div>
      </div>
    </main>

    <!-- Instructions / Footer -->
    <footer class="game-footer">
      <div class="controls-legend">
        <span class="badge">方向鍵 / WASD</span> 移動戰機
        <span class="badge">Space / J</span> 發射主砲
        <span class="badge">K / X</span> 釋放炸彈 (BOMB)
        <span class="badge">P</span> 暫停
        <span class="badge">M</span> 音效開關
        <span class="badge">R</span> 重新挑戰
      </div>
    </footer>

  </div>

  <script type="module" src="js/game.js"></script>
  <script>
    // CRT toggle button behavior
    const crtBtn = document.getElementById('crt-toggle-btn');
    const crtOverlay = document.getElementById('crt-scanlines');
    crtBtn.addEventListener('click', () => {
      crtOverlay.classList.toggle('active');
      crtBtn.classList.toggle('active');
    });

    // Detect mobile touch to auto show touch controls
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      document.getElementById('touch-controls').classList.add('touch-enabled');
    }
  </script>
</body>
