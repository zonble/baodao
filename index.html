<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>寶島風情畫 (Beautiful Formosa Shmup)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="arcade-cabinet">
    <header class="game-header">
      <div class="title-group">
        <h1 class="main-title">寶島風情畫</h1>
        <span class="subtitle">STAGE 1: 台北空照 (LEVEL 1)</span>
      </div>
      <div class="header-actions">
        <button id="lvl-toggle-btn" class="arcade-btn">🗺️ 第一關：台北</button>
        <button id="sound-toggle-btn" class="arcade-btn">🔊 音效</button>
        <button id="crt-toggle-btn" class="arcade-btn">📺 CRT 濾鏡</button>
        <button id="start-btn" class="arcade-btn primary-btn">▶ 開始遊戲</button>
      </div>
    </header>

    <div class="screen-wrapper">
      <canvas id="gameCanvas" width="800" height="480"></canvas>
      <div id="crt-scanlines" class="crt-overlay active"></div>
    </div>

    <!-- On-Screen Virtual Controls for Mobile/Touch -->
    <div id="touch-controls" class="touch-controls">
      <div class="dpad">
        <button id="btn-up" class="dpad-btn up">▲</button>
        <div class="dpad-mid">
          <button id="btn-left" class="dpad-btn left">◀</button>
          <div class="dpad-center"></div>
          <button id="btn-right" class="dpad-btn right">▶</button>
        </div>
        <button id="btn-down" class="dpad-btn down">▼</button>
      </div>

      <div class="action-buttons">
        <button id="btn-bomb" class="act-btn bomb-btn">💣 炸彈</button>
        <button id="btn-fire" class="act-btn fire-btn">⚡ 射擊</button>
      </div>
    </div>

    <!-- Instructions / Footer -->
    <footer class="game-footer">
      <div class="controls-legend">
        <span class="badge">方向鍵 / WASD</span> 移動戰機
        <span class="badge">Space / J</span> 發射主砲
        <span class="badge">K / X</span> 釋放炸彈 (BOMB)
        <span class="badge">P</span> 暫停
        <span class="badge">M</span> 音效開關
        <span class="badge">R</span> 重新挑戰
      </div>
      <div class="stage-info">
        <small>根據 <code>docs/level1.md</code> 至 <code>docs/level6.md</code> 規格實作：第一關「台北上空・超大珍珠奶茶」、第二關「淡水夕照・超大淡水鐵蛋」、第三關「新竹科園・超大新竹貢丸雙子」、第四關「台中綠園道・超級大手槍」、第五關「桃園航空城・超大巨無霸客機」與第六關「新北耶誕城・超大光雕耶誕樹」</small>
      </div>
    </footer>
  </div>

  <script type="module" src="js/game.js"></script>
  <script>
    // CRT toggle button behavior
    const crtBtn = document.getElementById('crt-toggle-btn');
    const crtOverlay = document.getElementById('crt-scanlines');
    crtBtn.addEventListener('click', () => {
      crtOverlay.classList.toggle('active');
      crtBtn.classList.toggle('active');
    });

    // Detect mobile touch to auto show touch controls
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      document.getElementById('touch-controls').classList.add('touch-enabled');
    }
  </script>
</body>
</html>
